<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{--ink:#eef5ff;--muted:#9ba8cc;--cyan:#49f6ff;--pink:#ff4dca;--lime:#d8ff58;--panel:rgba(13,20,48,.9)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a18;color:var(--ink);font-family:'Space Grotesk',sans-serif}body{display:grid;place-items:center;touch-action:none}#frame{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-height:320px;overflow:hidden;background:#080b1b;box-shadow:0 0 90px #070d24}canvas{width:100%;height:100%;display:block}.grain{pointer-events:none;position:absolute;inset:0;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E")}.hud{position:absolute;inset:0;pointer-events:none}.topline{position:absolute;left:4%;right:4%;top:4%;display:flex;align-items:center;justify-content:space-between;font:700 12px 'Space Mono',monospace;letter-spacing:.13em;color:#dbe7ff;text-transform:uppercase}.brand{display:flex;align-items:center;gap:10px}.brandmark{width:25px;height:25px;border:2px solid var(--cyan);transform:rotate(45deg);box-shadow:0 0 14px #49f6ff88;position:relative}.brandmark:after{content:'';position:absolute;inset:5px;background:var(--pink)}.top-actions{display:flex;gap:9px;pointer-events:auto}.iconbtn{border:1px solid #52638c;background:#101733bb;color:#d9e3ff;padding:8px 11px;border-radius:8px;font:700 10px 'Space Mono',monospace;cursor:pointer;letter-spacing:.08em}.iconbtn:hover{border-color:var(--cyan);color:var(--cyan)}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(8,12,30,.25),rgba(4,7,18,.74));}.overlay.hidden{display:none}.panel{width:min(650px,90%);padding:30px 34px;border:1px solid #6c80b044;border-radius:20px;background:linear-gradient(145deg,rgba(15,24,55,.94),rgba(8,13,34,.95));box-shadow:0 24px 80px #030510aa,inset 0 1px #ffffff12;position:relative;text-align:center}.panel:before{content:'';position:absolute;left:12%;right:12%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);filter:drop-shadow(0 0 8px var(--cyan))}.eyebrow{font:700 10px 'Space Mono',monospace;letter-spacing:.26em;color:var(--cyan);text-transform:uppercase}.title{font-size:clamp(38px,6.3vw,72px);font-weight:700;letter-spacing:-.08em;line-height:.9;margin:15px 0 10px;text-transform:uppercase}.title em{font-style:normal;color:var(--cyan);text-shadow:0 0 27px #49f6ff66}.subtitle{color:var(--muted);font-size:14px;line-height:1.55;margin:10px auto 23px;max-width:440px}.actions{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin-top:20px}.btn{cursor:pointer;border:0;border-radius:9px;padding:13px 22px;background:linear-gradient(110deg,#48eefa,#69bcff);color:#071221;font:700 12px 'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 5px 25px #49e8ff33;transition:.16s transform,.16s filter}.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn.secondary{background:#121c3c;color:#e3ecff;border:1px solid #475b89;box-shadow:none}.btn.pink{background:linear-gradient(110deg,#ff4dca,#ff788d);color:#210719}.keyrow{display:flex;justify-content:center;gap:18px;color:#91a1c8;font:10px 'Space Mono',monospace;margin-top:24px}.key{display:inline-flex;min-width:23px;height:21px;padding:0 5px;align-items:center;justify-content:center;border:1px solid #45547c;border-radius:4px;color:#eaf1ff;margin-right:5px}.level-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 5px}.level-card{text-align:left;padding:14px;border:1px solid #39476e;border-radius:12px;background:#0d1532;cursor:pointer;transition:.16s}.level-card:hover,.level-card.selected{border-color:var(--cyan);background:#102344;transform:translateY(-2px)}.level-card h3{margin:0;font-size:15px}.level-card p{color:#92a2c6;font:9px 'Space Mono',monospace;line-height:1.6;margin:8px 0 0}.stars{color:var(--lime);font-size:12px;letter-spacing:3px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px auto;max-width:430px}.setting{padding:13px;text-align:left;background:#0b1431;border:1px solid #35456d;border-radius:10px}.setting label{display:block;color:#9eacd0;font:10px 'Space Mono',monospace;letter-spacing:.1em;margin-bottom:8px}.setting select,.setting input{width:100%;background:#111e42;color:white;border:1px solid #455887;border-radius:6px;padding:8px;font:12px 'Space Grotesk',sans-serif}.progress-wrap{position:absolute;top:11%;left:25%;right:25%;height:7px;border-radius:9px;background:#182448aa;border:1px solid #56648a66;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 15px var(--cyan);transition:width .1s}.progress-text{position:absolute;top:9.2%;left:0;right:0;text-align:center;color:#e4edff;font:700 10px 'Space Mono',monospace;letter-spacing:.12em;text-shadow:0 1px 5px #000}.mobile-hint{position:absolute;bottom:4%;left:0;right:0;text-align:center;font:9px 'Space Mono',monospace;color:#94a4c7;opacity:.8}.pill{display:inline-block;border:1px solid #52658a;border-radius:30px;padding:5px 9px;color:#dce7ff;font:9px 'Space Mono',monospace;margin:2px}.results{display:flex;justify-content:center;gap:30px;margin:18px 0;color:#aab8d8;font:10px 'Space Mono',monospace}.results b{display:block;color:var(--cyan);font-size:21px;margin-top:5px}.sound-toggle{position:absolute;right:4%;bottom:4%;pointer-events:auto;color:#95a6cc;font:9px 'Space Mono',monospace;cursor:pointer}
@media(max-width:600px){.panel{padding:23px 17px}.level-list{grid-template-columns:1fr}.level-card{padding:10px}.level-card p{margin:4px 0 0}.title{font-size:48px}.subtitle{font-size:12px;margin:8px auto 14px}.keyrow{display:none}.topline{top:3%;font-size:9px}.progress-wrap{left:18%;right:18%;top:10%}.progress-text{top:8.1%}.settings-grid{grid-template-columns:1fr 1fr}.btn{padding:11px 16px}.mobile-hint{bottom:2%}}

<body><div id="frame"><canvas id="game" width="960" height="540" aria-label="Neon Dash platform game"></canvas><div class="grain"></div><div class="hud" id="hud"><div class="topline"><div class="brand"><i class="brandmark"></i><span>NEON//DASH</span></div><div id="levelName">SYNTHETIC SKY · 01</div><div class="top-actions"><button class="iconbtn" id="pauseBtn">Ⅱ &nbsp; PAUSE</button><button class="iconbtn" id="exitBtn">✕ &nbsp; EXIT</button></div></div><div class="progress-text" id="progressText">0%</div><div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div><div class="mobile-hint" id="mobileHint">TAP ANYWHERE TO JUMP</div></div><div class="overlay" id="overlay"><section class="panel" id="panel"></section></div><div class="sound-toggle" id="soundToggle">♫ &nbsp; SOUND ON</div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),frame=document.querySelector('#frame'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');
const hud=document.querySelector('#hud'),progressFill=document.querySelector('#progressFill'),progressText=document.querySelector('#progressText'),levelName=document.querySelector('#levelName'),mobileHint=document.querySelector('#mobileHint');
const W=960,H=540,groundY=430,playerSize=30;let screen='home',last=0,elapsed=0,scroll=0,runTime=0,progress=0,deathTimer=0,shake=0,particles=[],stars=[],objects=[],audioCtx=null,sound=true,paused=false,practice=false,checkpointX=0,selected=0,best=JSON.parse(localStorage.getItem('nd-best')||'[0,0,0]'),deaths=0,levelSeed=1;
let player={x:170,y:groundY-playerSize,vy:0,rot:0,mode:'cube',grounded:true,flip:1,hold:false};
const levels=[
 {name:'SYNTHETIC SKY',tag:'THE FIRST PULSE',difficulty:'EASY',color:'#49f6ff',bpm:112,length:4300,desc:'A clean beat. Find your rhythm.',pattern:'easy'},
 {name:'PULSE DRIVER',tag:'VOLTAGE WARNING',difficulty:'NORMAL',color:'#ff4dca',bpm:132,length:5100,desc:'Gravity flips. Keep your cool.',pattern:'mid'},
 {name:'CHROMA OVERDRIVE',tag:'EXPERT CIRCUIT',difficulty:'HARD',color:'#d8ff58',bpm:148,length:5700,desc:'No room for hesitation.',pattern:'hard'}
];
let level=levels[0];
function fit(){let r=frame.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}window.addEventListener('resize',fit);fit();
function rand(n){let x=Math.sin(n*127.1+levelSeed*311.7)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<100;i++)stars.push({x:rand(i+1)*W,y:rand(i+45)*H*.72,r:.4+rand(i+12)*1.6,a:.16+rand(i+5)*.6});
function tone(freq=440,dur=.08,type='sine',vol=.035){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function setScreen(s){screen=s;overlay.classList.toggle('hidden',s==='game');hud.style.display=s==='game'?'block':'none';document.querySelector('#soundToggle').style.display=s==='game'?'none':'block';if(s==='home')homeUI();}
function homeUI(){panel.innerHTML=`<div class="eyebrow">A rhythm platformer</div><h1 class="title">NEON<em>//</em><br>DASH</h1><p class="subtitle">Hit the beat. Dodge the static. Reach the other side.<br>A fast, unforgiving little rhythm adventure.</p><div><span class="pill">7 GAME MODES</span><span class="pill">3 NEON LEVELS</span><span class="pill">PRACTICE MODE</span></div><div class="actions"><button class="btn" id="playNow">▶ &nbsp; PLAY</button><button class="btn secondary" id="settingsBtn">⚙ &nbsp; SETTINGS</button></div><div class="keyrow"><span><i class="key">SPACE</i> JUMP / FLY</span><span><i class="key">ESC</i> PAUSE</span><span><i class="key">R</i> RESTART</span></div>`;document.querySelector('#playNow').onclick=()=>selectUI();document.querySelector('#settingsBtn').onclick=()=>settingsUI();}
function selectUI(){screen='select';overlay.classList.remove('hidden');panel.innerHTML=`<div class="eyebrow">Choose your frequency</div><h2 class="title" style="font-size:40px">SELECT <em>LEVEL</em></h2><p class="subtitle">Three handcrafted tracks. Each one introduces a new rhythm.</p><div class="level-list">${levels.map((l,i)=>`<article class="level-card ${i===selected?'selected':''}" data-i="${i}"><div class="stars">${'★'.repeat(i+1)}${'☆'.repeat(3-i-1)}</div><h3>${l.name}</h3><p>${l.difficulty} · ${l.bpm} BPM<br>BEST ${best[i]}%</p></article>`).join('')}</div><div class="actions"><button class="btn" id="startLevel">▶ &nbsp; START RUN</button><button class="btn pink" id="practiceBtn">◇ &nbsp; PRACTICE</button><button class="btn secondary" id="backHome">BACK</button></div>`;panel.querySelectorAll('.level-card').forEach(el=>el.onclick=()=>{selected=+el.dataset.i;selectUI()});document.querySelector('#startLevel').onclick=()=>startGame(false);document.querySelector('#practiceBtn').onclick=()=>startGame(true);document.querySelector('#backHome').onclick=()=>{screen='home';homeUI()};}
function settingsUI(){panel.innerHTML=`<div class="eyebrow">Tune your setup</div><h2 class="title" style="font-size:40px">PLAYER <em>SETTINGS</em></h2><p class="subtitle">Make the run feel like yours.</p><div class="settings-grid"><div class="setting"><label>ICON COLOR</label><select id="colorChoice"><option value="#49f6ff">CYBER CYAN</option><option value="#ff4dca">HOT PINK</option><option value="#d8ff58">ACID LIME</option><option value="#a47bff">VIOLET</option></select></div><div class="setting"><label>TRAIL EFFECT</label><select id="trailChoice"><option value="on">ON</option><option value="off">OFF</option></select></div><div class="setting"><label>GAME SPEED</label><select id="speedChoice"><option value="1">STANDARD</option><option value=".85">CHILL (85%)</option><option value="1.15">TURBO (115%)</option></select></div><div class="setting"><label>SCREEN SHAKE</label><select id="shakeChoice"><option value="on">ON</option><option value="off">OFF</option></select></div></div><div class="actions"><button class="btn" id="saveSettings">SAVE SETTINGS</button><button class="btn secondary" id="backHome">BACK</button></div>`;document.querySelector('#colorChoice').value=localStorage.getItem('nd-color')||'#49f6ff';for(const id of ['trailChoice','speedChoice','shakeChoice'])document.querySelector('#'+id).value=localStorage.getItem('nd-'+id)||({trailChoice:'on',speedChoice:'1',shakeChoice:'on'}[id]);document.querySelector('#saveSettings').onclick=()=>{for(const id of ['colorChoice','trailChoice','speedChoice','shakeChoice'])localStorage.setItem('nd-'+id,document.querySelector('#'+id).value);homeUI()};document.querySelector('#backHome').onclick=homeUI;}
function genLevel(){objects=[];let x=570;let idx=0;const pat=level.pattern;let gapBase=pat==='easy'?245:pat==='mid'?205:175;while(x<level.length+600){let r=rand(idx+selected*90);let gap=gapBase+(r-.5)*60;let typ=idx%9;
 if(typ===2&&selected>0){objects.push({type:'portal',x:x,y:groundY-95,w:34,h:90,mode:idx%18===2?'ship':'ball'});x+=130;}
 if(typ===5&&selected>1){objects.push({type:'portal',x:x,y:groundY-90,w:34,h:85,mode:idx%18===5?'wave':'spider'});x+=120;}
 if(typ===3&&selected>0){objects.push({type:'orb',x:x,y:groundY-105-r*70,w:22,h:22,used:false});x+=60;}
 if(r>.64){objects.push({type:'block',x,y:groundY-45,w:42,h:45});if(r>.89)objects.push({type:'spike',x:x+60,y:groundY-34,w:35,h:34});}
 else if(r>.23){let count= r>.46?2:1;for(let j=0;j<count;j++)objects.push({type:'spike',x:x+j*36,y:groundY-34,w:34,h:34});if(r>.51&&pat!=='easy')objects.push({type:'spike',x:x+count*36+16,y:groundY-34,w:34,h:34});}
 if(idx%7===4)objects.push({type:'coin',x:x+75,y:groundY-90-r*20,w:18,h:18,got:false});
 x+=gap;idx++;
 }
 objects.sort((a,b)=>a.x-b.x);objects.push({type:'finish',x:level.length,y:0,w:8,h:H});}
function startGame(prac){practice=prac;level=levels[selected];levelSeed=selected+1;runTime=0;scroll=0;progress=0;deaths=0;checkpointX=0;paused=false;particles=[];player={x:170,y:groundY-playerSize,vy:0,rot:0,mode:'cube',grounded:true,flip:1,hold:false};genLevel();setScreen('game');levelName.textContent=`${level.name} · ${prac?'PRACTICE':'NORMAL'}`;mobileHint.textContent='TAP / SPACE TO JUMP · HOLD TO FLY';progressFill.style.width='0%';progressText.textContent='0%';}
function restart(){if(practice&&checkpointX>0){scroll=checkpointX;progress=scroll/level.length;player.y=groundY-playerSize;player.vy=0;player.grounded=true;player.mode='cube';}else startGame(practice);paused=false;}
function pauseMenu(){if(screen!=='game')return;paused=true;overlay.classList.remove('hidden');panel.innerHTML=`<div class="eyebrow">Take a breath</div><h2 class="title" style="font-size:48px">RUN <em>PAUSED</em></h2><p class="subtitle">${Math.floor(progress*100)}% through ${level.name}</p><div class="actions"><button class="btn" id="resume">▶ &nbsp; RESUME</button><button class="btn pink" id="restart">↻ &nbsp; RESTART</button><button class="btn secondary" id="quit">EXIT RUN</button></div><div class="keyrow"><span><i class="key">ESC</i> RESUME</span></div>`;document.querySelector('#resume').onclick=()=>{paused=false;overlay.classList.add('hidden')};document.querySelector('#restart').onclick=restart;document.querySelector('#quit').onclick=()=>{setScreen('home');};}
function dead(){if(screen!=='game'||deathTimer>0)return;deaths++;if(localStorage.getItem('nd-shakeChoice')!=='off')shake=11;tone(105,.22,'sawtooth',.05);for(let i=0;i<25;i++)particles.push({x:player.x+playerSize/2,y:player.y+playerSize/2,vx:(Math.random()-.5)*370,vy:(Math.random()-.5)*370,life:.65,color:iconColor(),size:3+Math.random()*5});deathTimer=.72;}
function complete(){screen='complete';let pc=Math.max(0,Math.floor(progress*100));best[selected]=Math.max(best[selected],100);localStorage.setItem('nd-best',JSON.stringify(best));tone(740,.2,'triangle');overlay.classList.remove('hidden');hud.style.display='none';document.querySelector('#soundToggle').style.display='block';panel.innerHTML=`<div class="eyebrow">Track cleared · ${level.bpm} BPM</div><h2 class="title">LEVEL<br><em>COMPLETE</em></h2><p class="subtitle">You made it through ${level.name}. Clean execution.</p><div class="results"><span>COMPLETION<b>100%</b></span><span>ATTEMPTS<b>${deaths+1}</b></span><span>BEST<b>${best[selected]}%</b></span></div><div class="actions"><button class="btn" id="again">↻ &nbsp; PLAY AGAIN</button><button class="btn secondary" id="levels">LEVEL SELECT</button><button class="btn secondary" id="home">HOME</button></div>`;document.querySelector('#again').onclick=()=>startGame(practice);document.querySelector('#levels').onclick=selectUI;document.querySelector('#home').onclick=()=>{setScreen('home')};}
function iconColor(){return localStorage.getItem('nd-color')||'#49f6ff'}
function action(down){if(screen==='game'&&!paused){player.hold=down;if(down){if(player.mode==='cube'||player.mode==='robot'){if(player.grounded){player.vy=-590;player.grounded=false;tone(510,.07,'square',.025)}}else if(player.mode==='ball'||player.mode==='spider'){if(player.grounded){player.flip*=-1;player.vy=player.flip*470;player.grounded=false;tone(420,.08,'triangle',.03)}}else if(player.mode==='ufo'){player.vy=-490;tone(530,.06,'square',.025)}}}}
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)action(true)}if(e.code==='Escape'){if(screen==='game'&&!paused)pauseMenu();else if(paused){paused=false;overlay.classList.add('hidden')}}if(e.code==='KeyR'&&screen==='game')restart();});window.addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))action(false)});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();action(true)});window.addEventListener('pointerup',()=>action(false));
document.querySelector('#pauseBtn').onclick=pauseMenu;document.querySelector('#exitBtn').onclick=()=>{setScreen('home')};document.querySelector('#soundToggle').onclick=()=>{sound=!sound;document.querySelector('#soundToggle').textContent=sound?'♫  SOUND ON':'♫  SOUND OFF';if(sound)tone(650)};
function collideRect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){elapsed+=dt;if(shake>0)shake=Math.max(0,shake-dt*23);if(screen==='game'&&!paused){if(deathTimer>0){deathTimer-=dt;if(deathTimer<=0){if(practice){restart()}else{scroll=0;progress=0;player={x:170,y:groundY-playerSize,vy:0,rot:0,mode:'cube',grounded:true,flip:1,hold:false};particles=[]}}}else{
 let speed=(level.bpm*2.35)*(+(localStorage.getItem('nd-speedChoice')||1));scroll+=speed*dt;runTime+=dt;progress=Math.min(1,scroll/level.length);progressFill.style.width=(progress*100)+'%';progressText.textContent=Math.floor(progress*100)+'%';
 // practice checkpoints every quarter
 if(practice&&progress>.25&&checkpointX<level.length*.25)checkpointX=level.length*.25;if(practice&&progress>.5&&checkpointX<level.length*.5)checkpointX=level.length*.5;if(practice&&progress>.75&&checkpointX<level.length*.75)checkpointX=level.length*.75;
 const wasY=player.y;
 if(player.mode==='ship'||player.mode==='wave'){let thrust=player.mode==='wave'?player.hold:-player.hold;player.vy+=(thrust?-900:650)*dt;if(player.mode==='wave')player.vy=player.hold?-410:410;player.y+=player.vy*dt;player.y=Math.max(42,Math.min(groundY-playerSize,player.y));}else{player.vy+=1550*dt;player.y+=player.vy*dt;let floor=player.flip===1?groundY-playerSize:90;if(player.y>=floor&&player.flip===1){player.y=floor;player.vy=0;player.grounded=true}else if(player.y<=floor&&player.flip===-1){player.y=floor;player.vy=0;player.grounded=true}else player.grounded=false;}
 if(player.mode==='cube'||player.mode==='robot'||player.mode==='spider'){if(!player.grounded)player.rot+=dt*7.2*player.flip;else player.rot=Math.round(player.rot/(Math.PI/2))*Math.PI/2}else if(player.mode==='wave')player.rot=player.hold?-.65:.65;else if(player.mode==='ship')player.rot=Math.max(-.55,Math.min(.55,player.vy/900));else player.rot+=dt*2.5;
 let worldX=scroll+player.x;for(const o of objects){if(o.x<worldX-100||o.x>worldX+400)continue;let ox=o.x-scroll; if(o.type==='portal'&&Math.abs(ox-player.x)<28){if(player.mode!==o.mode){player.mode=o.mode;player.flip=1;player.vy=0;tone(700,.1,'sine')}continue}if(o.type==='orb'&&!o.used&&Math.abs(ox-(player.x+playerSize/2))<35&&Math.abs(o.y-(player.y+playerSize/2))<55){if(player.hold){o.used=true;player.vy=-640;player.grounded=false;emit(player.x+15,player.y+15,9,level.color);tone(880,.09,'triangle')}}if(o.type==='coin'&&!o.got&&Math.abs(ox-(player.x+15))<22&&Math.abs(o.y-(player.y+15))<26){o.got=true;emit(player.x+15,player.y+15,15,'#ffe56a');tone(990,.1,'sine')}
 if(o.type==='spike'||o.type==='block'){let box={x:player.x+5,y:player.y+4,w:playerSize-10,h:playerSize-8};let b={x:ox+4,y:o.y+5,w:o.w-8,h:o.h-5};if(collideRect(box,b)){dead();break}}
 if(o.type==='finish'&&worldX>=o.x){progress=1;complete();break}
 }
